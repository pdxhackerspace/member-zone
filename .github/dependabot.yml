# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
    # json 3.0 breaks every ActiveSupport::JSON.decode call. Remove that
    # ignore once the Gemfile pin goes away.
    # net-ssh 8 drops SHA-1 ssh-rsa and deprecated host-key options. We still
    # connect to hosts that need both, so stay on the latest 7.x.
    ignore:
      - dependency-name: json
        update-types: ["version-update:semver-major"]
      - dependency-name: net-ssh
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: staging

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: staging

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
