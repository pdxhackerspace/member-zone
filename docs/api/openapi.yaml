openapi: 3.1.0
info:
  title: Member Zone API
  version: 1.0.0
  summary: Programmatic access to Member Zone, the makerspace membership system.
  description: |
    The Member Zone API lets members, devices, and integrations work with Member Zone over HTTPS.

    **Authentication.** Every request except `GET /openapi.json` carries an API token in the
    `Authorization` header: `Authorization: Bearer mz_…`. Members create personal tokens from
    their profile (API tokens tab); administrators create tokens for service accounts such as
    kiosks and printers. A token is shown once, when it is created.

    **Scopes.** A token carries scopes, which are Member Zone privilege keys such as
    `parking.manage_notices`. A request succeeds only if the token has the scope the operation
    names *and* the token's holder currently holds that privilege. If the holder loses a role,
    their tokens lose that power immediately. Each operation lists its scope under
    `x-required-scope`.

    **Personal and service tokens.** A personal token acts for the member who holds it: parking
    calls under `/me/...` apply to that member, implicitly. A service-account token acts for
    others and names the member in the request (for example `member_ids`).

    **Token lifetime.** Tokens expire, at most a configurable number of days (default 365) after
    they are created or last extended. Holders are emailed before a token expires. An expired
    token can be extended and keeps working with the same secret; a revoked token is gone for
    good; a suspended token is refused until it is resumed. A token whose holder is no longer an
    active member is refused while they are inactive.

    **Errors.** Every error has the same shape: `{"error": {"code", "message", "details"}}`.
    `code` is stable and machine-readable; `message` is for people. A token that is missing,
    unknown, expired, suspended, revoked, or whose holder is inactive always gets the same
    `401 invalid_token`, deliberately without saying which.

    **Pagination.** List endpoints take `page` (from 1) and `per_page` (1–100, default 25),
    return totals in `meta`, and send RFC 8288 `Link` headers (`first`, `prev`, `next`, `last`).

    **Rate limits.** 120 requests a minute per token, and 600 a minute per client address; beyond that, `429 rate_limited` with a
    `Retry-After` header.

    **Times** are ISO 8601 in UTC.

    A narrative guide with worked examples is at `docs/api.md`; an index for language models is
    at `/llms.txt`.
servers:
  - url: /api/v1
security:
  - bearerToken: []
tags:
  - name: Tokens
    description: The token making the request.
  - name: Members
    description: Finding members to act for.
paths:
  /openapi.json:
    get:
      operationId: getOpenApiSpec
      summary: This API description
      description: Returns this OpenAPI document as JSON. Needs no token.
      security: []
      tags: [Tokens]
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
  /me:
    get:
      operationId: getCurrentToken
      summary: Describe the token making the request
      description: |
        Returns the token's holder, its scopes, the subset of those scopes the holder can use
        right now (`effective_scopes`), and when it expires. Any valid token may call this; use
        it to check that a client is configured correctly.
      tags: [Tokens]
      x-required-scope: null
      responses:
        '200':
          description: The token.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Token'
              example:
                data:
                  id: 12
                  name: Front desk kiosk
                  hint: x9Qa
                  kind: service
                  scopes: [parking.issue_for_members]
                  effective_scopes: [parking.issue_for_members]
                  expires_at: '2027-10-14T17:00:00Z'
                  holder:
                    id: 431
                    name: Front Desk Kiosk
                    username: kiosk-front
                    email: null
                    active: true
        '401':
          $ref: '#/components/responses/InvalidToken'
  /members:
    get:
      operationId: searchMembers
      summary: Find members
      description: |
        Finds up to 20 members whose name, username, or alias contains `q`, or whose email
        address is exactly `q` (email is stored encrypted, so it matches only in full). Members
        whose profiles are private are left out unless the token also has `members.view_profile`.
        Use the returned `id` wherever a request takes a member id.
      tags: [Members]
      x-required-scope: api.users.search
      parameters:
        - name: q
          in: query
          required: true
          description: Part of a name, username, or alias; or a whole email address.
          schema:
            type: string
            minLength: 1
          example: ada
      responses:
        '200':
          description: Matching members, by display name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
              example:
                data:
                  - id: 42
                    name: Ada Lovelace
                    username: ada
                    email: ada@example.com
                    active: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /members/{id}:
    get:
      operationId: getMember
      summary: Get one member
      description: Returns one member by id, subject to the same profile visibility as search.
      tags: [Members]
      x-required-scope: api.users.search
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: A Member Zone API token, beginning `mz_`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      description: Page number, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [bad_request, invalid_token, insufficient_scope, forbidden, not_found, conflict,
                     validation_failed, rate_limited, print_failed]
              description: Stable, machine-readable error code.
            message:
              type: string
              description: Human-readable explanation.
            details:
              type: object
              description: |
                Extra context. `insufficient_scope` gives `required_scope`; `validation_failed`
                gives `fields`, a map of field name to error messages.
    PaginationMeta:
      type: object
      required: [page, per_page, total]
      additionalProperties: false
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    Member:
      type: object
      required: [id, name, username, email, active]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
          description: Display name.
        username:
          type: [string, 'null']
        email:
          type: [string, 'null']
        active:
          type: boolean
          description: Whether the member currently has active membership.
    Token:
      type: object
      required: [id, name, hint, kind, scopes, effective_scopes, expires_at, holder]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        hint:
          type: string
          description: The token's last four characters.
        kind:
          type: string
          enum: [personal, service]
        scopes:
          type: array
          items:
            type: string
        effective_scopes:
          type: array
          description: The scopes the holder can use right now.
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        holder:
          $ref: '#/components/schemas/Member'
  responses:
    BadRequest:
      description: The request is malformed or missing a required parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: bad_request
              message: q is required.
              details: {}
    InvalidToken:
      description: |
        The token is missing, unknown, expired, suspended, revoked, or belongs to someone who is
        no longer an active member. The response does not say which.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer realm="Member Zone", error="invalid_token"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_token
              message: The access token is missing, invalid, or no longer active.
              details: {}
    InsufficientScope:
      description: The token lacks the operation's scope, or its holder lacks the privilege.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: insufficient_scope
              message: This token needs the parking.manage_notices scope, and its holder the privilege.
              details:
                required_scope: parking.manage_notices
    Forbidden:
      description: The token may use this operation, but not on this record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such record, or not one this token may see.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Not found.
              details: {}
    ValidationFailed:
      description: The record could not be saved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_failed
              message: Expires at must be within 2 weeks
              details:
                fields:
                  expires_at: [must be within 2 weeks]
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
