name: Staging - Build and Push Image

# Build whatever lands on staging, plus an optional manual rebuild.
#
# `push`, after two failed attempts with the pull-request events. staging is a protected
# branch that takes no direct pushes, so every push to it *is* a merged PR — the same
# moment the old `pull_request: [closed]` trigger was approximating, and the policy that
# trigger existed to express (`enforce-main-pr-source.yml` and branch protection are where
# it is actually enforced). What `push` additionally gets right:
#
#   * The token is writable. A `pull_request` event raised by a PR from a fork hands the job
#     a read-only GITHUB_TOKEN, so the GHCR push and the buildx cache export both failed
#     ("cache write denied: token has no writable scopes") on exactly the fork merges this
#     workflow most needed to handle. A push event is a base-repository event and always
#     carries the repository's own token and cache scope.
#   * This file's source ref is unambiguous: a push event runs the workflow as it exists on
#     the pushed ref. `pull_request_target` would have been the other way to get a writable
#     token, but which branch's copy of the file it runs is poorly documented — GitHub's own
#     event reference describes it in terms of the *default* branch, which here is `main`.
#     Staging work would then be built by whatever `main` happened to hold, and a change to
#     this file would do nothing until it was promoted.
#   * checkout stays out of it. v7 refuses any ref it can match to a fork PR's head or merge
#     SHA when the event is `pull_request_target`, so building the merge commit needed
#     `allow-unsafe-pr-checkout: true`. On a push event the guard does not apply at all, and
#     the default checkout is already the pushed commit.
on:
  push:
    branches: [staging]
  workflow_dispatch:

# Every run builds one commit on staging and pushes one `:staging` tag, so a burst of merges
# should collapse onto the newest rather than race near-identical builds and let whichever
# finished last win. Safe at workflow level here because, unlike the `closed` trigger this
# replaces, there is no event that starts a run which then declines to build.
concurrency:
  group: staging-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/member-zone

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No `ref`. On a push event the default is the pushed commit itself, which is
          # precisely the tree we mean to build — no window in which a later merge changes
          # what a running build picks up. `git rev-parse HEAD` below names it, so the
          # image tag cannot drift from the tree either.
          #
          # Full history and tags so the version below can find the newest release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build identity and image tags
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          # Anchor to the newest release tag in the repo, not to `git describe`:
          # describe walks ancestry, and because staging and main diverge it would
          # anchor staging to a much older tag and make it look older than
          # production. awk rather than `head -1`, which trips pipefail.
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | awk 'NR==1')
          if [ -n "$LATEST" ]; then
            COUNT=$(git rev-list --count "${LATEST}..HEAD")
            # 0.50.1+109.abc1234.staging — "0.50.1 plus 109 commits of staging
            # work", so it reads as comparable to the 0.51.0 in production.
            APP_VERSION="${LATEST#v}+${COUNT}.${SHORT_SHA}.staging"
          else
            APP_VERSION="0.0.0+${SHORT_SHA}.staging"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          # ignore-error so a cache service hiccup, or a token that cannot write the cache,
          # never discards an image that already built and pushed.
          cache-to: type=gha,mode=max,ignore-error=true
