# When the merge target is main, the head branch must be staging or hotfix/*.
#
# Releases no longer travel through a branch: release.yml tags a commit that is
# already on main, so there is nothing to police on the staging side.
#
# Add as a required status check for main.

name: Enforce PR source branch rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

jobs:
  allowed-main-source:
    runs-on: ubuntu-latest

    steps:
      - name: Require staging or hotfix/* when merging to main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            staging|hotfix/*)
              ;;
            *)
              echo "::error::Pull requests into \`main\` must come from \`staging\` or \`hotfix/*\`. This PR is from \`$HEAD_REF\`."
              exit 1
              ;;
          esac

          echo "OK: source branch allowed for merge into main."
