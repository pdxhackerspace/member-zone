name: Staging - Build and Push Image

# Build when a PR is merged into staging — not on push to staging (avoids coupling
# to unrelated pushes while a staging→main release PR is open) and not when validating
# a PR whose base is main. Optional manual rebuild via workflow_dispatch.
on:
  pull_request:
    types: [closed]
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Do not build when a release/* branch merges (disallowed into staging; defense in depth).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request && github.event.pull_request.merged == true &&
       !startsWith(github.event.pull_request.head_ref, 'release/'))

    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/member-zone

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'staging' }}
          # Full history and tags so `git describe` can name this build.
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build identity and image tags
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          # Anchor to the newest release tag in the repo, not to `git describe`:
          # describe walks ancestry, and because staging and main diverge it would
          # anchor staging to a much older tag and make it look older than
          # production. awk rather than `head -1`, which trips pipefail.
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | awk 'NR==1')
          if [ -n "$LATEST" ]; then
            COUNT=$(git rev-list --count "${LATEST}..HEAD")
            # 0.50.1+109.abc1234.staging — "0.50.1 plus 109 commits of staging
            # work", so it reads as comparable to the 0.51.0 in production.
            APP_VERSION="${LATEST#v}+${COUNT}.${SHORT_SHA}.staging"
          else
            APP_VERSION="0.0.0+${SHORT_SHA}.staging"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
