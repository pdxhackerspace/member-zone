name: Staging - Build and Push Image

# Build when a PR is merged into staging — not on push to staging (avoids coupling
# to unrelated pushes while a staging→main release PR is open) and not when validating
# a PR whose base is main. Optional manual rebuild via workflow_dispatch.
#
# pull_request_target, not pull_request: on a `pull_request` event raised by a PR from a
# fork, GITHUB_TOKEN is read-only, so both the GHCR push and the buildx cache export fail
# ("cache write denied: token has no writable scopes"). pull_request_target runs this file
# as it exists on the base branch, with a writable token and the base branch's cache scope.
# That is a trusted context, so this job builds `staging` itself and never a ref carried by
# the event — see the note on the checkout step.
on:
  pull_request_target:
    types: [closed]
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Do not build when a release/* branch merges (disallowed into staging; defense in depth).
    # `github.head_ref`, as in enforce-main-pr-source.yml, and not
    # `github.event.pull_request.head_ref`: the webhook payload spells that `head.ref`, so
    # the old form read null, startsWith coerced it to '', and the guard never once fired.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request && github.event.pull_request.merged == true &&
       !startsWith(github.head_ref, 'release/'))

    # On the job, not the workflow: every run builds the tip of staging, so a burst of
    # merges wants one group — a per-merge-commit group would race several near-identical
    # builds to push one `:staging` tag and let whichever finished last win, newest or not.
    # But `closed` also fires for PRs closed *without* merging, and a workflow-level group
    # is claimed before `if` is evaluated, so those no-op runs would cancel a real build and
    # strand the merge with no image. A job-level group is only claimed once the job
    # survives `if`, so unmerged closes cancel nothing.
    concurrency:
      group: staging-image
      cancel-in-progress: true

    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/member-zone

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Always the branch, never the event's merge_commit_sha. checkout v7 refuses any
          # ref it can match to a fork PR's head or merge SHA under pull_request_target
          # (allow-unsafe-pr-checkout opts out of that, and is not worth taking), and the
          # branch is what we actually want: the job only runs for a merged PR, so the tip
          # of staging already contains it. `git rev-parse HEAD` below names whatever was
          # really built, so the image tag cannot drift from the tree.
          ref: staging
          # Full history and tags so `git describe` can name this build.
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build identity and image tags
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          # Anchor to the newest release tag in the repo, not to `git describe`:
          # describe walks ancestry, and because staging and main diverge it would
          # anchor staging to a much older tag and make it look older than
          # production. awk rather than `head -1`, which trips pipefail.
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | awk 'NR==1')
          if [ -n "$LATEST" ]; then
            COUNT=$(git rev-list --count "${LATEST}..HEAD")
            # 0.50.1+109.abc1234.staging — "0.50.1 plus 109 commits of staging
            # work", so it reads as comparable to the 0.51.0 in production.
            APP_VERSION="${LATEST#v}+${COUNT}.${SHORT_SHA}.staging"
          else
            APP_VERSION="0.0.0+${SHORT_SHA}.staging"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          # ignore-error so a cache service hiccup, or a token that cannot write the cache,
          # never discards an image that already built and pushed.
          cache-to: type=gha,mode=max,ignore-error=true
